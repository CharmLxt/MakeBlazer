[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "makeblazer"
version = "99.26.1"
description = "Сверхбыстрая локальная машина времени для ваших файлов (легковесный аналог Git)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "CharmLxt", email = "reception.mailspypi@gmail.com" }]
keywords = ["backup", "snapshot", "git", "timemachine", "charmpkk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://pypi.org/project/makeblazer/"

[project.optional-dependencies]
charm = ["CharmPkk>=25.10.26b1"]

[project.scripts]
makeblazer = "makeblazer.cli:main"

[tool.setuptools.packages.find]
include = ["makeblazer*"]